    <h1>Mathematics Formula Sheet</h1>

    <h2>Algebra</h2>
    <p>(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></p>
    <p>(a - b)<sup>2</sup> = a<sup>2</sup> - 2ab + b<sup>2</sup></p>
    <p>a<sup>2</sup> + b<sup>2</sup> = (a + b)<sup>2</sup> - 2ab</p>

    <hr>

    <h2>Geometry</h2>
    <p>Area of Circle = &pi;r<sup>2</sup></p>
    <p>Area of Triangle = &frac12; &times; base &times; height</p>

    <hr>

    <h2>Mensuration</h2>
    <p>Volume of Cube = a<sup>3</sup></p>
    <p>Volume of Cylinder = &pi;r<sup>2</sup>h</p>
